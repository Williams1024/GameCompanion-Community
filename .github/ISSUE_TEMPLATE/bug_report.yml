name: Bug report
description: Report a repeatable Game Companion problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Game Companion. Remove API keys, tokens, email addresses, account IDs, payment details, and other private information before submitting.
  - type: input
    id: version
    attributes:
      label: Game Companion version
      description: Find this in the app title bar or About screen.
      placeholder: 1.26.112.0
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Account tier
      options:
        - Community
        - Free trial
        - Explorer
        - Crafter
        - Architect
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Sign-in or account
        - Voice or microphone
        - Commands or macros
        - Game Brain or context
        - Local AI
        - Billing or GCT
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you did, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here only after removing credentials and personal information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal information from everything attached.
          required: true

